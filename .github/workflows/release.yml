name: Release

# Publish to crates.io when a version tag such as v0.1.0 is pushed.
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the tag matches the crate version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          }
      # `cargo publish` builds the package, which needs GPUI's packages.
      - run: >-
          sudo apt-get update && sudo apt-get install -y
          libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev
          libssl-dev libzstd-dev libasound2-dev libvulkan1
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
