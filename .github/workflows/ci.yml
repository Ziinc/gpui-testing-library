name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # The same packages gpui-kit installs for its Linux CI.
      - run: >-
          sudo apt-get update && sudo apt-get install -y
          libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev
          libssl-dev libzstd-dev libasound2-dev libvulkan1
      - run: cargo fmt --check
      - run: cargo clippy --all-features --all-targets -- --deny warnings
      - run: cargo test --all-features

  # Tests against the crates this library is used alongside (compat/).
  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compat
      # GPUI's packages, plus Tauri's (WebKitGTK, GTK) for tauri-gpui and
      # lavapipe for gpui-visual-test's headless renderer.
      - run: >-
          sudo apt-get update && sudo apt-get install -y
          libfontconfig-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev
          libx11-xcb-dev libssl-dev libzstd-dev libasound2-dev libvulkan1
          libwebkit2gtk-4.1-dev libgtk-3-dev mesa-vulkan-drivers
      - run: cargo fmt --check
        working-directory: compat
      - run: cargo clippy --all-targets -- --deny warnings
        working-directory: compat
      - run: cargo test
        working-directory: compat
